<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <!-- Outer Glow / Shadow -->
  <filter id="bone-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8"/>
  </filter>
  
  <g filter="url(#bone-shadow)">
    <!-- Base black silhouette for strong comic outline -->
    <path d="M7 2 L11 8 L14 13 L17 14 C19 14 21 15 22 17 C23 18.5 24 20 23.5 22 C23 24 22 26 21 27 C20 28.5 19 30 17 31 C15 32 12 32 10 30 C8.5 28.5 7.5 27 6 25 C5 23 4.5 21 5 19 C5.5 17 6.5 15 8 13 L6 5 Z" fill="#050505" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Index Finger (Pointing Up-Left) -->
    <!-- Distal phalanx (tip) -->
    <path d="M6 3 C6 2 7 1 8 2 C9 3 9.5 4.5 9 6 C8.5 7.5 7.5 7.5 7 6 C6.5 4.5 6 4 6 3 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <path d="M8 2 C8.5 3 8.5 4.5 8 5" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Middle phalanx -->
    <path d="M7.5 7 C8.5 6.5 10 7.5 10.5 9 C11 10.5 10 12 9 12.5 C8 12.5 7 11 7 9.5 C7 8.5 7 7.5 7.5 7 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <path d="M9.5 8 C10 9.5 9.5 11 9 11.5" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Proximal phalanx -->
    <path d="M9.5 13 C10.5 12 12.5 13 13 15 C13.5 17 12.5 19 11 19 C9.5 18.5 9 17 9 15 C9 14 9 13.5 9.5 13 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>

    <!-- Middle Finger (Curled) -->
    <path d="M14 13 C15 11 17 11.5 18 13 C19 14.5 18 16 17 17 C15.5 17 14.5 15.5 14 13 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <path d="M17 17 C18.5 17.5 19.5 19 19 21 C18.5 22.5 17 23 15.5 22.5 C15 21 15.5 19 17 17 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>

    <!-- Ring Finger (Curled) -->
    <path d="M19 15 C20 14 21.5 14.5 22 16 C22.5 17.5 22 19 21 19.5 C20 19.5 19 18 19 16.5 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <path d="M21 19.5 C22 20 22.5 21.5 22 23 C21.5 24.5 20 25 19 24.5 C18.5 23 19 21 21 19.5 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>

    <!-- Pinky Finger (Curled) -->
    <path d="M22.5 18 C23.5 17.5 24.5 18 25 19.5 C25.5 21 24.5 22 23.5 22.5 C22.5 22 22 20.5 22.5 18 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <path d="M23.5 22.5 C24.5 23 24.5 24.5 24 25.5 C23.5 26.5 22 27 21 26.5 C20.5 25.5 21.5 24 23.5 22.5 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>

    <!-- Thumb (Curled inward/down) -->
    <path d="M6 14 C6.5 13 8 13.5 8.5 15 C9 16.5 8 18 7 18.5 C6 18 5.5 16 6 14 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <path d="M7 18.5 C7.5 19.5 9 20 9.5 21.5 C10 23 9 24.5 8 24.5 C7 24 6.5 22 7 20 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>

    <!-- Metacarpals & Palm Bones -->
    <path d="M11 20 C12.5 19.5 14 20.5 14.5 22.5 C15 24.5 13.5 26 12 26 C10.5 25.5 10 23.5 11 20 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <path d="M15 22.5 C16.5 22 17.5 23.5 17.5 25.5 C17.5 27 16 28 14.5 28 C13.5 27 14 24.5 15 22.5 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <path d="M18 24 C19 23.5 20 24.5 20 26 C20 27.5 18.5 28.5 17.5 28.5 C17 27.5 17 25.5 18 24 Z" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>

    <!-- Wrist / Carpal Bones -->
    <ellipse cx="11" cy="28.5" rx="1.8" ry="1.5" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <ellipse cx="14" cy="29.5" rx="1.8" ry="1.5" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <ellipse cx="17" cy="30" rx="1.8" ry="1.5" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
    <ellipse cx="13" cy="32" rx="2" ry="1.5" fill="#e2e8f0" stroke="#111111" stroke-width="1.2"/>

    <!-- Fingertip Amber Ember Spark -->
    <circle cx="6" cy="2.5" r="1.5" fill="#ff7700" opacity="0.9"/>
  </g>
</svg>
